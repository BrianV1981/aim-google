version: 2

project_name: aim-google

changelog:
  disable: true

builds:
  - id: aim-google
    main: ./cmd/aim-google
    binary: aim-google
    ldflags: >-
      -s -w
      -X github.com/BrianV1981/aim-google/internal/cmd.version={{ .Tag }}
      -X github.com/BrianV1981/aim-google/internal/cmd.commit={{ .ShortCommit }}
      -X github.com/BrianV1981/aim-google/internal/cmd.date={{ .Date }}
    env:
      - CGO_ENABLED=0
    targets:
      - linux_amd64
      - linux_arm64
      - windows_amd64
      - windows_arm64
  - id: aim_google_darwin
    main: ./cmd/aim-google
    binary: aim-google
    ldflags: >-
      -s -w
      -X github.com/BrianV1981/aim-google/internal/cmd.version={{ .Tag }}
      -X github.com/BrianV1981/aim-google/internal/cmd.commit={{ .ShortCommit }}
      -X github.com/BrianV1981/aim-google/internal/cmd.date={{ .Date }}
    env:
      - CGO_ENABLED=1
    targets:
      - darwin_amd64
      - darwin_arm64

archives:
  - builds:
      - aim-google
      - aim_google_darwin
    format: tar.gz
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        format: zip

checksum:
  name_template: checksums.txt
